services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: nabat
      POSTGRES_USER: nabat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a hex-only database password}
    volumes:
      - nabat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nabat -d nabat']
      interval: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: worker
    env_file: .env.production
    environment: &runtime
      NODE_ENV: production
      ENABLE_DEMO: 'false'
      DATABASE_URL: postgresql://nabat:${POSTGRES_PASSWORD}@postgres:5432/nabat
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    env_file: .env.production
    environment: *runtime
    ports: ['3000:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    env_file: .env.production
    environment: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  nabat-postgres:
